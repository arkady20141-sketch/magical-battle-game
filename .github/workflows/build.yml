name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: android-34
          sdk-build-tools: 34.0.0
          sdk-components: platform-tools
      - name: Install Gradle 8.1
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1-bin.zip -O /tmp/gradle.zip
          unzip -d /home/runner/gradle /tmp/gradle.zip
          echo "GRADLE_HOME=/home/runner/gradle/gradle-8.1" >> $GITHUB_ENV
          echo "PATH=/home/runner/gradle/gradle-8.1/bin:$PATH" >> $GITHUB_ENV
      - run: gradle --version
      - run: gradle assembleDebug
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: Магічна Битва (останній APK)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
