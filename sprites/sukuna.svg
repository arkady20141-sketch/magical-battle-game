  <!-- Head -->
  <rect x="10" y="8" width="12" height="8" fill="#ffffff"/>
  
  <!-- Eyes -->
  <rect x="14" y="8" width="1" height="1" fill="#cc0000"/>
  <rect x="15" y="8" width="1" height="1" fill="#cc0000"/>
  <rect x="17" y="8" width="1" height="1" fill="#cc0000"/>
  <rect x="18" y="8" width="1" height="1" fill="#cc0000"/>
  
  <!-- Tattoos -->
  <rect x="10" y="10" width="2" height="1" fill="#660000"/>
  <rect x="20" y="10" width="2" height="1" fill="#660000"/>
  
  <!-- Body -->
