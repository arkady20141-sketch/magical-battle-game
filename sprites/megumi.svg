  <!-- Head -->
  <rect x="10" y="8" width="12" height="8" fill="#ffcc99"/>
  
  <!-- Eyes -->
  <rect x="14" y="8" width="1" height="1" fill="#00ff00"/>
  <rect x="15" y="8" width="1" height="1" fill="#00ff00"/>
  <rect x="17" y="8" width="1" height="1" fill="#00ff00"/>
  <rect x="18" y="8" width="1" height="1" fill="#00ff00"/>
  
  <!-- Body -->
